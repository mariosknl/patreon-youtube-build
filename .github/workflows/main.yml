name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # User routes render on request, so this does not call Sanity.
      # The values below are placeholders. Vercel still needs the real keys
      # listed in the pull request; Studio's static page only needs the
      # public Sanity id and dataset to load its config.
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SANITY_PROJECT_ID: ciprojectid
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-05-07"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: placeholder-not-a-secret
          NEXT_PUBLIC_SCHEMATIC_PUBLISHABLE_KEY: ci-placeholder
          SCHEMATIC_API_KEY: ci-placeholder
          NEXT_PUBLIC_CUSTOMER_PORTAL_COMPONENT_ID: ci-placeholder
